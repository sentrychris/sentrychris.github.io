<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary metadata ───────────────────────────────── -->

    <!-- ─── Open Graph (Facebook, LinkedIn, Slack, iMessage) ── -->
